<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta.title }}</title>
  <meta name="description" content="{{ meta.description }}">
  <link rel="canonical" href="{{ meta.canonical_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ meta.title }}">
  <meta property="og:description" content="{{ meta.description }}">
  <meta property="og:url" content="{{ meta.share_url }}">
  <meta property="og:site_name" content="The Academy Watch">
  <meta property="og:image" content="{{ meta.image_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta.title }}">
  <meta name="twitter:description" content="{{ meta.description }}">
  <meta name="twitter:image" content="{{ meta.image_url }}">
  <meta http-equiv="refresh" content="0; url={{ meta.canonical_url }}">
</head>
<body>
  <p><a href="{{ meta.canonical_url }}">View this player on The Academy Watch</a></p>
</body>
</html>
