name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate auto-merge for Dependabot PRs
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commits=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --slurp | jq 'add')
          if [[ $(jq 'length' <<< "$commits") -eq 0 ]]; then
            decision='deny: no commits'
          elif jq -e 'any(.[]; .author.login != "dependabot[bot]")' <<< "$commits" > /dev/null; then
            decision='deny: non-dependabot commit'
          else
            decision=$(jq -r '.[-1].commit.message' <<< "$commits" | bash .github/scripts/dependabot-update-gate.sh)
          fi

          if [[ "$decision" == allow ]]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            gh pr merge --disable-auto "$PR_URL" || true
            echo "::notice::auto-merge not enabled: ${decision#deny: }"
          fi
