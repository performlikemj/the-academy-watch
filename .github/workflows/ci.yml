name: CI

on:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-security:
    name: Frontend Dependency Security
    # Keep this cheap scan on drafts too (recent runs take under one minute).
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=./academy-watch-frontend/pnpm-lock.yaml
      fail-on-vuln: true

  frontend-build:
    name: Frontend Build & Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: academy-watch-frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: academy-watch-frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: academy-watch-frontend
        run: pnpm lint

      - name: Build
        working-directory: academy-watch-frontend
        run: pnpm build

  backend-lint:
    name: Backend Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: python -m pip install ruff==0.16.0

      - name: Run ruff lint
        run: ruff check academy-watch-backend

      - name: Run ruff format check
        run: ruff format --check academy-watch-backend

      # Dependabot #832 broke ACR by mismatching pydantic and pydantic-core.
      - name: Resolve backend requirements (python 3.11, dry run)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r academy-watch-backend/requirements.txt

  backend-tests:
    name: Backend Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: academy-watch-backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: academy-watch-backend
        env:
          SKIP_API_HANDSHAKE: '1'
          API_USE_STUB_DATA: 'true'
          TEST_ONLY_MANU: 'false'
          # Required to construct the newsletter client at import time.
          OPENAI_API_KEY: 'test-not-a-real-key'
        run: python -m pytest -q

  frontend-tests:
    name: Frontend Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: dependency-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: academy-watch-frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: academy-watch-frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: academy-watch-frontend
        run: node scripts/run-tests.mjs

  contact-lock-postgres:
    name: Contact Lock PostgreSQL Regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aw_p2_c1
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: academy-watch-backend
    env:
      C1_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aw_p2_c1
      SKIP_API_HANDSHAKE: '1'
      API_USE_STUB_DATA: 'true'
      TEST_ONLY_MANU: 'false'
      OPENAI_API_KEY: 'test-not-a-real-key'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build disposable model schema
        run: |
          python - <<'PY'
          import os
          from flask import Flask
          from flask_migrate import Migrate, stamp
          import importlib
          import pkgutil
          from src.models.league import db
          import src.models
          for module in pkgutil.iter_modules(src.models.__path__):
              importlib.import_module("src.models." + module.name)
          app = Flask(__name__)
          app.config.update(SQLALCHEMY_DATABASE_URI=os.environ['C1_POSTGRES_URL'], SQLALCHEMY_TRACK_MODIFICATIONS=False)
          db.init_app(app)
          Migrate(app, db)
          with app.app_context():
              db.create_all()
              stamp(directory='migrations', revision='p2c1')
          PY
      - name: Reviewer regressions and first-attempt success controls
        run: >-
          python -m pytest -q tests/test_account_scope_gap_postgres.py tests/test_contact_lock_batches.py
          tests/test_contact_lock_review_postgres.py tests/test_contact_lock_review_pairs_postgres.py
          tests/test_contact_lock_matrix_postgres.py
          -k 'not inventory_action_pair'
