version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/academy-watch-frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
  - package-ecosystem: "pip"
    directory: "/academy-watch-backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # numpy >= 2.5 requires Python >= 3.12; the backend image is
      # python:3.11-slim, so 2.5.x breaks the ACR build. Pin to 2.4.x until
      # the base image is bumped to 3.12. (Re-bumped repeatedly by Dependabot.)
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
      # openai-agents (0.19.x) requires mcp<2; mcp 2.x breaks pip resolution in
      # the ACR build (no PR-level CI installs backend deps, so it lands silently).
      # Drop this when openai-agents supports mcp>=2.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # pydantic pins pydantic-core exactly, so both must be bumped by hand.
      # Standalone pydantic-core bumps broke the ACR build in #832 (and twice before).
      # (Security updates bypass this ignore — the CI dry-run fails them, so they cannot auto-merge.)
      - dependency-name: "pydantic-core"
